<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1C3B2A">
  <meta name="description" content="四色牌傳統同盟規則：紅黃配、綠白配。56張古法牌庫，搖一搖摸一副好籤。">
  <title>四色諧音牌・同盟好運籤</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap"
    rel="stylesheet">
  <!-- 引入截圖函式庫供圖片分享使用 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --felt: #234536;
      --felt-deep: #142A1D;
      --cream: #F2E9D5;
      --cream-soft: #C9C0AA;

      --ink: #221C19;
      --ink-soft: #4A3E37;
      --red: #C0342A;
      --red-deep: #8C1F18;
      --gold: #A8823E;
      --gold-light: #DFC384;

      /* 四色牌色 */
      --tile-red-a: #FF3B30;
      --tile-red-b: #D70015;
      --tile-red-ink: #1E1206;
      --tile-green-a: #34C759;
      --tile-green-b: #248A3D;
      --tile-green-ink: #10240F;
      --tile-yellow-a: #FFD60A;
      --tile-yellow-b: #FF9F0A;
      --tile-yellow-ink: #241D06;
      --tile-white-a: #FFFFFF;
      --tile-white-b: #E5E5EA;
      --tile-white-ink: #201A12;

      --a-red: #C63A12;
      --a-yellow: #C79A10;
      --a-green: #177A2C;
      --a-white: #8C8371;
      --a-mixed: #A8823E;

      --shake-time: 1.2s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--cream);
      background: radial-gradient(125% 90% at 50% 6%, #2E5941 0%, var(--felt) 46%, var(--felt-deep) 100%);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(45deg, rgba(0, 0, 0, .10) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 6px);
    }

    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 4px 6px;
    }

    .btn--book-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, .28);
      border: 1px solid rgba(223, 195, 132, .45);
      border-radius: 999px;
      padding: 5px 14px;
      color: var(--cream);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: .08em;
      transition: background .2s ease, transform .12s ease;
    }

    .btn--book-trigger:active {
      transform: scale(.96);
    }

    .btn--book-trigger .badge-count {
      color: #FFE58F;
      font-weight: 700;
      font-size: 12px;
    }

    .masthead {
      flex: 0 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .masthead__title {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: clamp(26px, 7.4vw, 33px);
      letter-spacing: .26em;
      text-indent: .26em;
      color: var(--cream);
    }

    .masthead__sub {
      margin: 8px 0 0;
      font-size: 13px;
      letter-spacing: .06em;
      color: var(--cream-soft);
      line-height: 1.5;
    }

    .seal {
      width: 42px;
      height: 42px;
      margin: 0 0 10px;
      display: grid;
      place-items: center;
      transform: rotate(-7deg);
      background: linear-gradient(160deg, var(--red), var(--red-deep));
      border-radius: 5px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
      color: #FBEFD8;
      font-family: "Noto Serif TC", serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1;
    }

    /* 四色牌面：直角 */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 9% 0;
      border-radius: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      line-height: .9;
      color: var(--tile-ink);
      box-shadow: 0 4px 8px -3px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .35);
    }

    .tile__glyph {
      display: block;
    }

    .tile__glyph--bottom {
      transform: rotate(180deg);
    }

    .tile--red {
      --tile-ink: var(--tile-red-ink);
      background: linear-gradient(168deg, var(--tile-red-a), var(--tile-red-b));
    }

    .tile--yellow {
      --tile-ink: var(--tile-yellow-ink);
      background: linear-gradient(168deg, var(--tile-yellow-a), var(--tile-yellow-b));
    }

    .tile--green {
      --tile-ink: var(--tile-green-ink);
      background: linear-gradient(168deg, var(--tile-green-a), var(--tile-green-b));
    }

    .tile--white {
      --tile-ink: var(--tile-white-ink);
      background: linear-gradient(168deg, var(--tile-white-a), var(--tile-white-b));
      border: 1px solid rgba(120, 110, 88, .45);
    }

    /* 抽牌舞台 */
    .table-stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: clamp(28px, 5.5vh, 48px);
      overflow: hidden;
    }

    .fan {
      position: relative;
      width: 230px;
      height: 210px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .fan .fan__card {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 56px;
      height: 125px;
      margin-left: -28px;
      transform-origin: 50% 138%;
      border-radius: 0;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    }

    .fan .fan__card:nth-child(1) {
      transform: rotate(-22deg);
    }

    .fan .fan__card:nth-child(2) {
      transform: rotate(-11deg);
    }

    .fan .fan__card:nth-child(3) {
      transform: rotate(0deg);
    }

    .fan .fan__card:nth-child(4) {
      transform: rotate(11deg);
    }

    .fan .fan__card:nth-child(5) {
      transform: rotate(22deg);
    }

    .fan .tile {
      font-size: 26px;
    }

    @keyframes deck-shake {
      0% {
        transform: rotate(0deg) translateX(0);
      }

      9% {
        transform: rotate(-9deg) translateX(-9px);
      }

      21% {
        transform: rotate(8deg) translateX(9px);
      }

      33% {
        transform: rotate(-7deg) translateX(-8px);
      }

      45% {
        transform: rotate(6deg) translateX(7px);
      }

      57% {
        transform: rotate(-5deg) translateX(-5px);
      }

      69% {
        transform: rotate(4deg) translateX(4px);
      }

      81% {
        transform: rotate(-2.5deg)translateX(-2px);
      }

      92% {
        transform: rotate(1.2deg) translateX(1px);
      }

      100% {
        transform: rotate(0deg) translateX(0);
      }
    }

    .is-shaking {
      animation: deck-shake var(--shake-time) cubic-bezier(.36, .07, .19, .97) both;
    }

    .fly-layer {
      position: absolute;
      left: 50%;
      top: 105px;
      width: 0;
      height: 0;
      z-index: 5;
      pointer-events: none;
    }

    .fly-tile {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 80px;
      margin: -40px 0 0 -22px;
      font-size: 20px;
      opacity: 0;
      will-change: transform, opacity;
      animation: fly-scatter .95s ease-out forwards;
    }

    @keyframes fly-scatter {
      0% {
        opacity: 0;
        transform: translate(0, 26px) rotate(0deg) rotateY(0deg) scale(.5);
      }

      14% {
        opacity: 1;
      }

      60% {
        opacity: 1;
        transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) rotateY(180deg) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(var(--fx), calc(var(--fy) - 24px)) rotate(calc(var(--fr) + 36deg)) rotateY(360deg) scale(.9);
      }
    }

    .actions {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 84px;
      justify-content: center;
      margin-bottom: clamp(12px, 3vh, 28px);
    }

    .btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .16em;
      text-indent: .16em;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 14px 38px;
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
      transform: none;
    }

    .btn--draw {
      color: #FCF3DF;
      border-color: var(--gold-light);
      background: linear-gradient(180deg, #CE4032 0%, var(--red) 45%, var(--red-deep) 100%);
      box-shadow: 0 14px 26px -12px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .28);
      min-width: 220px;
    }

    .btn--again {
      color: #FCF3DF;
      border-color: var(--gold-light);
      background: linear-gradient(180deg, #CE4032 0%, var(--red) 45%, var(--red-deep) 100%);
      box-shadow: 0 10px 20px -10px rgba(0, 0, 0, .8);
      font-size: 14px;
      padding: 11px 22px;
      letter-spacing: .12em;
      text-indent: .12em;
    }

    .btn--copy {
      color: var(--cream);
      background: transparent;
      border-color: rgba(223, 195, 132, .6);
      font-size: 14px;
      font-weight: 500;
      padding: 11px 22px;
      letter-spacing: .12em;
      text-indent: .12em;
    }

    .shake-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .35);
      border: 1px solid rgba(223, 195, 132, .4);
      color: var(--cream);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .shake-badge__icon {
      display: inline-block;
      animation: phone-wiggle 1.2s infinite ease-in-out;
      font-size: 18px;
    }

    @keyframes phone-wiggle {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-18deg);
      }

      75% {
        transform: rotate(18deg);
      }
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--cream-soft);
      min-height: 1.2em;
      text-align: center;
      max-width: 320px;
      white-space: pre-line;
    }

    .hint--error {
      color: #FFB4A6;
    }

    /* 開牌結果畫面 */
    #viewResult {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(env(safe-area-inset-top) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 14px);
    }

    .result-scroll {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 1.8vh, 16px);
      padding: 0;
    }

    .hand {
      flex: 0 0 auto;
      width: 100%;
      text-align: center;
    }

    .hand__label {
      margin: 0 0 10px;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: .08em;
      color: var(--cream-soft);
    }

    .hand__label em {
      font-style: normal;
      color: #FFE58F;
      font-weight: 700;
    }

    .hand__grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      column-gap: 4px;
      row-gap: 12px;
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
    }

    .hand__grid .tile {
      width: 100%;
      aspect-ratio: 22/42;
      font-size: 12px;
      padding: 5% 0;
      border-radius: 0;
      transition: transform .25s ease, opacity .25s ease, filter .25s ease;
    }

    @keyframes win-glow {

      0%,
      100% {
        box-shadow:
          0 0 0 2px #FFE58F,
          0 0 7px 2px rgba(255, 215, 0, 0.7),
          0 6px 12px -3px rgba(0, 0, 0, 0.85);
      }

      50% {
        box-shadow:
          0 0 0 2px #FFFFFF,
          0 0 14px 4px rgba(255, 215, 0, 0.95),
          0 8px 16px -3px rgba(0, 0, 0, 0.9);
      }
    }

    .hand__grid .tile--hit {
      z-index: 10 !important;
      position: relative !important;
      transform: translateY(-3px) scale(1.06) !important;
      border: 1.5px solid #FFF3C4 !important;
      animation: win-glow 1.25s ease-in-out infinite !important;
      filter: brightness(1.1) contrast(1.05);
    }

    .hand__grid .tile--dim {
      opacity: 0.35 !important;
      filter: saturate(.35) brightness(.85) !important;
      transform: scale(.95) !important;
    }

    /* 籤牌吊飾區 */
    .charm {
      position: relative;
      flex: 0 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding-top: 24px;
      transform-origin: 50% 6px;
      transform: rotate(0deg);
    }

    .charm__cord {
      position: absolute;
      top: 0;
      left: 50%;
      margin-left: -44px;
      width: 88px;
      height: 54px;
      z-index: 3;
      pointer-events: none;
    }

    .tag {
      --accent: var(--a-mixed);
      position: relative;
      padding: 22px 18px 12px;
      border-radius: 18px;
      border: 1.5px solid var(--accent);
      color: #1A1412;
      background-color: #F8F1DF;
      background-image:
        repeating-linear-gradient(96deg, rgba(158, 118, 58, .04) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #FAF4E8 0%, #F3E7CE 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        inset 0 -3px 8px rgba(120, 86, 40, .12),
        0 20px 30px -15px rgba(0, 0, 0, .8);
    }

    .tag::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--accent);
      opacity: .45;
      border-radius: 13px;
      pointer-events: none;
    }

    .tag__band {
      position: absolute;
      left: 26%;
      right: 26%;
      height: 4px;
      background: var(--accent);
      opacity: .85;
      border-radius: 3px;
    }

    .tag__band--top {
      top: 11px;
    }

    .tag__band--bottom {
      bottom: 9px;
    }

    .tag__eyelet {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 4px solid #B5912F;
      background: radial-gradient(circle at 50% 32%, #4A3B2C, #7A6851);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 255, 255, .8);
      z-index: 2;
    }

    .tag__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tag__meld {
      font-family: "Noto Serif TC", serif;
      font-size: 13.5px;
      letter-spacing: .1em;
      color: var(--accent);
      font-weight: 700;
    }

    .tag__grade {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-indent: .1em;
      color: #FCF4E2;
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--gold-light);
      background: linear-gradient(180deg, var(--red), var(--red-deep));
      white-space: nowrap;
    }

    .tag__keyword {
      margin: 8px 0 0;
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: clamp(23px, 6.8vw, 29px);
      line-height: 1.15;
      letter-spacing: .12em;
      text-indent: .12em;
      color: #1A1412;
    }

    .tag__rule {
      width: 44px;
      height: 3px;
      margin: 6px auto 7px;
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      opacity: .8;
    }

    .tag__pun {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: #382C24;
      font-weight: 500;
      text-align: justify;
      text-justify: inter-ideograph;
    }

    .tag__advice {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(168, 130, 62, .35);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .advice__cell {
      padding: 0 8px;
      text-align: center;
    }

    .advice__cell+.advice__cell {
      border-left: 1px solid rgba(168, 130, 62, .35);
    }

    .advice__label {
      display: block;
      font-family: "Noto Serif TC", serif;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .advice__cell--do .advice__label {
      color: var(--red);
    }

    .advice__cell--avoid .advice__label {
      color: #1A1412;
    }

    .advice__value {
      font-size: 11.5px;
      color: #382C24;
      font-weight: 500;
      line-height: 1.35;
    }

    @keyframes charm-drop {
      0% {
        opacity: 0;
        transform: translateY(-40px) rotate(-8deg);
      }

      40% {
        opacity: 1;
        transform: translateY(0) rotate(5deg);
      }

      70% {
        transform: rotate(-2deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .charm--in {
      animation: charm-drop 1.1s cubic-bezier(.26, .8, .32, 1) forwards;
    }

    .result-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 6px;
    }

    .result-head {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 13px;
      letter-spacing: .22em;
      color: var(--cream-soft);
    }

    .result-actions {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 80px);
      transform: translate(-50%, 14px);
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(10, 20, 14, .95);
      color: #F6EEDC;
      font-size: 13px;
      letter-spacing: .08em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 60;
    }

    .toast--show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .charm.is-exporting {
      animation: none !important;
      transform: none !important;
      background: radial-gradient(125% 90% at 50% 6%, #2E5941 0%, #234536 46%, #142A1D 100%) !important;
      padding: 24px 18px 20px !important;
      border-radius: 16px !important;
    }

    .is-exporting .tag {
      background: #F8F1DF !important;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7) !important;
    }

    .is-exporting .tag__pun,
    .is-exporting .advice__value {
      color: #221A15 !important;
    }

    /* ========================================================
       典籍風格樣式
       ======================================================== */
    .book-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(8, 18, 12, .88);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .book-modal--show {
      opacity: 1;
      pointer-events: auto;
    }

    .book-binder {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 86vh;
      background: #F4ECE1;
      border-radius: 16px;
      border: 3px solid #8C6F3B;
      box-shadow: 0 24px 48px rgba(0, 0, 0, .8), inset 0 0 0 2px #DFCCA3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .book-binder::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20px;
      width: 2px;
      background: rgba(140, 111, 59, 0.25);
      border-right: 1px dashed rgba(140, 111, 59, 0.4);
      pointer-events: none;
    }

    .book-header {
      flex: 0 0 auto;
      padding: 16px 20px 12px 34px;
      border-bottom: 1.5px solid rgba(140, 111, 59, 0.35);
      background: linear-gradient(180deg, #F9F4EB 0%, #EDE3D1 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .book-header__title {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 20px;
      font-weight: 900;
      color: #38281F;
      letter-spacing: .15em;
    }

    .book-progress {
      font-size: 12.5px;
      color: #6C5535;
      font-weight: 700;
      margin-top: 3px;
    }

    .book-close-btn {
      background: transparent;
      border: 1px solid #9C8156;
      color: #38281F;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .12s ease;
    }

    .book-close-btn:active {
      transform: scale(.9);
    }

    .book-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 14px 18px 30px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* 圖鑑中的卡片 */
    .book-card {
      position: relative;
      background: #FDF9F0;
      border: 1.5px solid #D2BE99;
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 124px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .08);
      transition: transform .15s ease, box-shadow .15s ease;

    /* 已解鎖可點擊卡片樣式 */
    .book-card--unlocked {
      cursor: pointer;
    }

    .book-card--unlocked:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(140, 111, 59, 0.25);
      border-color: #A8823E;

    .book-card--unlocked:active {

    .book-card__top {

      gap: 4px;
    }

    .book-card__id {

      font-family: "Noto Serif TC", serif;

    .book-card__grade {

    .book-card__keyword {
      font-family: "Noto Serif TC", serif;

    .book-card__meld {
      font-size: 10.5px;
      text-align: center;
      color: #7A5F35;
      font-weight: 700;

    .book-card__pun {
      font-size: 10px;

      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;

    .book-card__view-tip {
      font-size: 9.5px;
      color: #A03126;
      text-align: right;
      font-weight: 700;
      margin-top: 5px;
      letter-spacing: .04em;
    }

    /* 未收集狀態：淡墨灰暗／剪影效果 */
    .book-card--locked {
      background: rgba(220, 212, 196, .45);
      border: 1.5px dashed #B8A88E;

    .book-card--locked .locked-icon {
      font-size: 20px;
      margin: 10px auto;
      display: block;
      opacity: .55;
    }
  </style>
</head>

<body>
  <main class="stage">

    <!-- 畫面一：牌桌 -->
    <section class="view" id="viewDraw">
      <div class="top-bar">
        <button class="btn--book-trigger" id="btnOpenBook" type="button" aria-label="打開好運籤譜圖鑑">

      <div class="table-stage" id="tableStage">

              class="tile__glyph tile__glyph--bottom">將</span></div>
          <div class="fan__card tile tile--white"><span class="tile__glyph tile__glyph--top">卒</span><span
              class="tile__glyph tile__glyph--bottom">卒</span></div>

        <button class="btn--book-trigger" id="btnOpenBookResult" type="button" aria-label="打開好運籤譜圖鑑">

              </linearGradient>
            </defs>
            <path d="M60,79 C31,60 29,21 60,7 C91,21 89,60 60,79 Z" fill="none" stroke="url(#cord)" stroke-width="5"
              stroke-linecap="round" />
            <rect x="50" y="68" width="20" height="13" rx="6" fill="#A5271F" />
            <rect x="50" y="68" width="20" height="5" rx="2.5" fill="rgba(255,255,255,.22)" />
          </svg>

          <article class="tag" id="tag">

      <div class="result-actions">

        <button class="btn btn--copy" id="btnShareImage" type="button">分享結果圖片</button>
      </div>
    </section>

    <!-- 📖 圖鑑典籍彈窗 -->
    <div class="book-modal" id="bookModal" aria-hidden="true">
      <div class="book-binder">
        <header class="book-header">
          <div>
            <h2 class="book-header__title">籤譜藏經閣</h2>
            <div class="book-progress" id="bookProgressText">已收集 0 / 56 (0%)</div>
          </div>
          <button class="book-close-btn" id="btnCloseBook" type="button" aria-label="關閉圖鑑">✕</button>
        </header>

        <div class="book-content" id="bookCardGrid">
          <!-- 圖鑑卡片由 JavaScript 動態生成 -->
        </div>
      </div>
    </div>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const FORTUNES_URL = "fortunes.json";

    const PIECES = [
      { id: "general", redGlyph: "帥", blackGlyph: "將" },
      { id: "guard", redGlyph: "仕", blackGlyph: "士" },
      { id: "elephant", redGlyph: "相", blackGlyph: "象" },
      { id: "chariot", redGlyph: "俥", blackGlyph: "車" },
      { id: "horse", redGlyph: "傌", blackGlyph: "馬" },
      { id: "cannon", redGlyph: "炮", blackGlyph: "包" },
      { id: "pawn", redGlyph: "兵", blackGlyph: "卒" }
    ];

    const SUITS = [
      { id: "yellow", label: "黃", army: "red", alliance: "red_alliance" },
      { id: "red", label: "紅", army: "red", alliance: "red_alliance" },
      { id: "green", label: "綠", army: "black", alliance: "black_alliance" },
      { id: "white", label: "白", army: "black", alliance: "black_alliance" }
    ];

    const COPIES = 2;
    const HAND_SIZE = 20;

    // 儲存金鑰：待抽牌池、已抽記錄、上一張摸出的 ID、累積解鎖的總集合（圖鑑）
    const STORAGE_KEY_DRAW_DECK = "four_color_fortune_remaining_deck";
    const STORAGE_KEY_LAST_DRAWN = "four_color_fortune_last_drawn_id";
    const STORAGE_KEY_COLLECTED = "four_color_fortune_collected_ids";

    let fortunePool = [];
    let currentHand = [];
    let currentMeld = null;
    let currentFortune = null;
    let collectedSet = new Set(loadStorageList(STORAGE_KEY_COLLECTED));

    const el = {
      viewDraw: document.getElementById("viewDraw"),
      viewResult: document.getElementById("viewResult"),
      tableStage: document.getElementById("tableStage"),
      fan: document.getElementById("fan"),
      flyLayer: document.getElementById("flyLayer"),
      shakeBadge: document.getElementById("shakeBadge"),
      btnDraw: document.getElementById("btnDraw"),
      btnAgain: document.getElementById("btnAgain"),
      btnShareImage: document.getElementById("btnShareImage"),
      hint: document.getElementById("hint"),
      handLabel: document.getElementById("handLabel"),
      handGrid: document.getElementById("handGrid"),
      charm: document.getElementById("charm"),
      tag: document.getElementById("tag"),
      tagMeld: document.getElementById("tagMeld"),
      tagGrade: document.getElementById("tagGrade"),
      tagKeyword: document.getElementById("tagKeyword"),
      tagPun: document.getElementById("tagPun"),
      tagAdvice: document.getElementById("tagAdvice"),
      toast: document.getElementById("toast"),
      // 圖鑑元素
      btnOpenBook: document.getElementById("btnOpenBook"),
      btnOpenBookResult: document.getElementById("btnOpenBookResult"),
      btnCloseBook: document.getElementById("btnCloseBook"),
      bookModal: document.getElementById("bookModal"),
      bookProgressText: document.getElementById("bookProgressText"),
      bookCardGrid: document.getElementById("bookCardGrid"),
      badgeCountDraw: document.querySelector(".badge-count--draw"),
      badgeCountResult: document.querySelector(".badge-count--result")
    };

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let isDrawing = false;
    let motionSupported = false;
    let motionActive = false;
    let isIOSRequiringPermission = false;
    let isCharmAnimationDone = false;

    function loadStorageList(key) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : [];
      } catch (e) {
        return [];
      }
    }

    function saveStorageList(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) { }
    }

    function showToast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add("toast--show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.toast.classList.remove("toast--show"), 2000);
    }

    function buildDeck() {
      const deck = [];
      for (const suit of SUITS) {
        for (const piece of PIECES) {
          const glyph = suit.army === "red" ? piece.redGlyph : piece.blackGlyph;
          for (let i = 0; i < COPIES; i++) {
            deck.push({
              suit: suit.id,
              label: suit.label,
              piece: piece.id,
              glyph: glyph,
              alliance: suit.alliance
            });
          }
        }
      }
      return deck;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * 牌袋隨機發牌（Bag Randomizer）：
     * 1. 確保池內每一張都會被摸過一遍才換輪
     * 2. 換新一輪時，首張自動避開上一輪最後一張
     */
    function pickNextGuaranteedFortune() {
      let remainingIds = loadStorageList(STORAGE_KEY_DRAW_DECK);
      const lastDrawnId = Number(localStorage.getItem(STORAGE_KEY_LAST_DRAWN)) || null;

      if (!Array.isArray(remainingIds) || remainingIds.length === 0) {
        const allIds = fortunePool.map(f => f.id);
        remainingIds = shuffle(allIds);

        if (remainingIds.length > 1 && remainingIds[0] === lastDrawnId) {
          const first = remainingIds.shift();
          remainingIds.push(first);
        }
      }

      const nextId = remainingIds.shift();
      saveStorageList(STORAGE_KEY_DRAW_DECK, remainingIds);
      localStorage.setItem(STORAGE_KEY_LAST_DRAWN, nextId);

      // 同步圖鑑解鎖
      collectedSet.add(nextId);
      saveStorageList(STORAGE_KEY_COLLECTED, Array.from(collectedSet));
      updateCollectionBadge();

      return fortunePool.find(f => f.id === nextId) || fortunePool[0];
    }

    /**
     * 根據指定籤詩，湊出包含該同盟的一副手牌
     */
    function buildHandForFortune(fortune) {
      let deck = buildDeck();
      let seed = [];

      for (const cardKey of fortune.cards) {
        const [suit, piece] = cardKey.split("-");
        const idx = deck.findIndex(c => c.suit === suit && c.piece === piece);
        if (idx !== -1) {
          seed.push(deck.splice(idx, 1)[0]);
        }
      }

      if (seed.length < 2) {
        return shuffle(buildDeck()).slice(0, HAND_SIZE);
      }

      const remainDeck = shuffle([...deck]);
      const hand = [...seed];

      while (hand.length < HAND_SIZE && remainDeck.length > 0) {
        hand.push(remainDeck.pop());
      }

      const finalHand = shuffle(hand);
      const hitIndices = [];
      seed.forEach(s => {
        const found = finalHand.findIndex((c, i) =>
          !hitIndices.includes(i) && c.suit === s.suit && c.piece === s.piece
        );
        if (found !== -1) hitIndices.push(found);
      });

      currentMeld = {
        id: "alliance_combo",
        cards: hitIndices
      };

      return finalHand;
    }

    function dealWeightedHand() {
      const chosenFortune = pickNextGuaranteedFortune();
      currentFortune = chosenFortune;
      return buildHandForFortune(chosenFortune);
    }

    function spawnFlyingTiles(hand) {
      el.flyLayer.innerHTML = "";
      hand.forEach((card, i) => {
        const fly = makeTile(card);
        fly.classList.add("fly-tile");
        fly.style.setProperty("--fx", (Math.random() * 260 - 130).toFixed(0) + "px");
        fly.style.setProperty("--fy", (Math.random() * -140 - 20).toFixed(0) + "px");
        fly.style.setProperty("--fr", (Math.random() * 360 - 180).toFixed(0) + "deg");
        fly.style.animationDelay = (i * 28) + "ms";
        el.flyLayer.appendChild(fly);
      });
    }

    function clearFlyingTiles() {
      el.flyLayer.innerHTML = "";
    }

    function makeTile(card, extraClass) {
      const tile = document.createElement("div");
      tile.className = "tile tile--" + card.suit + (extraClass ? " " + extraClass : "");
      tile.setAttribute("aria-label", card.label + card.glyph);
      const top = document.createElement("span");
      top.className = "tile__glyph tile__glyph--top";
      top.textContent = card.glyph;
      const bottom = document.createElement("span");
      bottom.className = "tile__glyph tile__glyph--bottom";
      bottom.textContent = card.glyph;
      bottom.setAttribute("aria-hidden", "true");
      tile.append(top, bottom);
      return tile;
    }

    function renderAdvice(text) {
      el.tagAdvice.innerHTML = "";
      const parts = String(text).split("/").map(s => s.trim()).filter(Boolean);
      const kinds = ["do", "avoid"];
      parts.slice(0, 2).forEach((part, i) => {
        const seg = part.split(/[:：]/);
        const label = (seg[0] || "").trim();
        const value = (seg.slice(1).join("：") || "").trim();
        const cell = document.createElement("div");
        cell.className = "advice__cell advice__cell--" + (kinds[i] || "do");
        cell.innerHTML = '<span class="advice__label"></span><span class="advice__value"></span>';
        cell.querySelector(".advice__label").textContent = label;
        cell.querySelector(".advice__value").textContent = value;
        el.tagAdvice.appendChild(cell);
      });
    }

    function renderResult() {
      const hit = new Set(currentMeld.cards);

      el.handGrid.innerHTML = "";
      currentHand.forEach((card, i) => {
        const extra = hit.has(i) ? "tile--hit" : "tile--dim";
        const tile = makeTile(card, extra);
        el.handGrid.appendChild(tile);
      });

      el.handLabel.innerHTML = `手牌二十支・開出同盟組合：<em>【${currentFortune.meld_name}】</em>`;

      const isRedAlliance = currentFortune.cards[0].startsWith("red") || currentFortune.cards[0].startsWith("yellow");
      el.tag.style.setProperty("--accent", isRedAlliance ? "var(--a-red)" : "var(--a-green)");
      el.tagMeld.textContent = currentFortune.meld_name;
      el.tagGrade.textContent = currentFortune.grade;
      el.tagKeyword.textContent = currentFortune.keyword;
      el.tagPun.textContent = currentFortune.pun;
      renderAdvice(currentFortune.advice);

      el.viewDraw.hidden = true;
      el.viewResult.hidden = false;

      isCharmAnimationDone = false;
      el.btnShareImage.disabled = true;
      el.charm.classList.remove("charm--in");
      void el.charm.offsetWidth;
      el.charm.classList.add("charm--in");

      setTimeout(() => {
        isCharmAnimationDone = true;
        el.btnShareImage.disabled = false;
      }, 1150);
    }

    function drawFortune() {
      if (isDrawing || !el.viewResult.hidden) return;
      if (fortunePool.length === 0) { showToast("籤詩還沒載入完成"); return; }
      isDrawing = true;
      el.btnDraw.disabled = true;

      currentHand = dealWeightedHand();

      if (reduceMotion) {
        setTimeout(finish, 150);
        return;
      }
      spawnFlyingTiles(currentHand);
      el.fan.classList.add("is-shaking");
      setTimeout(finish, 1450);
    }

    function finish() {
      el.fan.classList.remove("is-shaking");
      clearFlyingTiles();
      renderResult();
      isDrawing = false;
      el.btnDraw.disabled = false;
    }

    function resetToDraw() {
      el.viewResult.hidden = true;
      el.viewDraw.hidden = false;
      el.charm.classList.remove("charm--in");
      clearFlyingTiles();
      el.btnDraw.disabled = false;
      isDrawing = false;
      updateDrawUI();
    }

    /**
     * 從圖鑑直接開啟指定籤詩詳情
     */
    function inspectFortuneFromBook(fortune) {
      currentFortune = fortune;
      currentHand = buildHandForFortune(fortune);
      closeBook();
      renderResult();
    }

    async function shareResultImage() {
      if (!currentFortune) return;

      if (!isCharmAnimationDone) {
        showToast("正在擺正籤牌，請稍候...");
        await new Promise(r => setTimeout(r, 600));
      }

      el.btnShareImage.disabled = true;
      showToast("正在生成圖片...");

      el.charm.classList.add("is-exporting");
      await new Promise(r => setTimeout(r, 60));

      try {
        const canvas = await html2canvas(el.charm, {
          backgroundColor: "#183223",
          scale: 2.5,
          useCORS: true,
          logging: false
        });

        el.charm.classList.remove("is-exporting");

        canvas.toBlob(async (blob) => {
          if (!blob) {
            showToast("圖片生成失敗，請手動截圖");
            el.btnShareImage.disabled = false;
            return;
          }

          const file = new File([blob], `fortune-${currentFortune.id}.png`, { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: "四色諧音牌・好運籤",
                text: `我摸到了【${currentFortune.meld_name}】：${currentFortune.keyword}！`,
                files: [file]
              });
              showToast("已成功分享！");
            } catch (err) {
              if (err.name !== "AbortError") {
                downloadFallback(blob);
              }
            }
          } else {
            downloadFallback(blob);
          }
          el.btnShareImage.disabled = false;
        }, "image/png");
      } catch (err) {
        console.error(err);
        el.charm.classList.remove("is-exporting");
        showToast("截圖失敗，建議直接螢幕截圖");
        el.btnShareImage.disabled = false;
      }
    }

    function downloadFallback(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fortune-${currentFortune.id || "card"}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("籤牌圖片已下載保存");
    }

    const SHAKE_THRESHOLD = 20;
    let lastShakeAt = 0;

    function onDeviceMotion(e) {
      const a = e.accelerationIncludingGravity || e.acceleration;
      if (!a) return;

      const x = a.x || 0;
      const y = a.y || 0;
      const z = a.z || 0;
      const force = Math.sqrt(x * x + y * y + z * z);

      if (force > 0.5) {
        if (!motionSupported) {
          motionSupported = true;
          motionActive = true;
          updateDrawUI();
        }

        const now = Date.now();
        if (force > SHAKE_THRESHOLD && now - lastShakeAt > 1800) {
          lastShakeAt = now;
          if (!el.viewDraw.hidden && !isDrawing) {
            drawFortune();
          }
        }
      }
    }

    function activateMotionListener() {
      window.addEventListener("devicemotion", onDeviceMotion);
      motionActive = true;
      updateDrawUI();
    }

    function initMotion() {
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      if (!isTouchDevice) {
        fallbackToButton();
        return;
      }

      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        isIOSRequiringPermission = true;
        el.shakeBadge.hidden = true;
        el.btnDraw.hidden = false;
        el.btnDraw.textContent = "點我啟用搖晃摸牌";
        el.hint.textContent = "iOS 需點擊授權感測器";
      } else if ("DeviceMotionEvent" in window) {
        window.addEventListener("devicemotion", onDeviceMotion);
        setTimeout(() => {
          if (!motionSupported) fallbackToButton();
        }, 800);
      } else {
        fallbackToButton();
      }
    }

    function handleMainButtonClick() {
      if (isIOSRequiringPermission) {
        DeviceMotionEvent.requestPermission()
          .then(state => {
            if (state === "granted") {
              isIOSRequiringPermission = false;
              activateMotionListener();
              showToast("搖晃感應已開啟！");
            } else {
              isIOSRequiringPermission = false;
              fallbackToButton("未開啟感應權限，改用按鈕摸牌");
            }
          })
          .catch(() => {
            isIOSRequiringPermission = false;
            fallbackToButton("裝置不支援感應，改用按鈕摸牌");
          });
      } else {
        drawFortune();
      }
    }

    function fallbackToButton(msg) {
      motionActive = false;
      el.shakeBadge.hidden = true;
      el.btnDraw.hidden = false;
      el.btnDraw.textContent = "按我摸牌";
      el.hint.textContent = msg || "";
    }

    function updateDrawUI() {
      if (motionActive) {
        el.shakeBadge.hidden = false;
        el.btnDraw.hidden = true;
        el.hint.textContent = "";
      } else {
        el.shakeBadge.hidden = true;
        el.btnDraw.hidden = false;
      }
    }

    /* ========================================================
       圖鑑
       ======================================================== */
    function updateCollectionBadge() {
      const total = fortunePool.length || 56;
      const count = collectedSet.size;
      const label = `${count}/${total}`;
      if (el.badgeCountDraw) el.badgeCountDraw.textContent = label;
      if (el.badgeCountResult) el.badgeCountResult.textContent = label;
    }

    function renderBookCollection() {
      el.bookCardGrid.innerHTML = "";
      const total = fortunePool.length || 56;
      const count = collectedSet.size;
      const percent = total > 0 ? Math.round((count / total) * 100) : 0;

      el.bookProgressText.textContent = `已收集 ${count} / ${total} (${percent}%)`;

      fortunePool.forEach(fortune => {
        const isUnlocked = collectedSet.has(fortune.id);
        const cardEl = document.createElement("article");
        cardEl.className = `book-card ${isUnlocked ? "book-card--unlocked" : "book-card--locked"}`;

        if (isUnlocked) {
          cardEl.setAttribute("role", "button");
          cardEl.setAttribute("tabindex", "0");
          cardEl.setAttribute("aria-label", `查看【${fortune.meld_name}】：${fortune.keyword}`);
          cardEl.innerHTML = `
            <div class="book-card__top">
              <span class="book-card__id">#${String(fortune.id).padStart(2, "0")}</span>
              <span class="book-card__grade">${fortune.grade}</span>
            </div>
            <h3 class="book-card__keyword">${fortune.keyword}</h3>
            <div class="book-card__meld">【${fortune.meld_name}】</div>
            <p class="book-card__pun">${fortune.pun}</p>
            <div class="book-card__view-tip">點擊查看全貌 ➔</div>
          `;

          const triggerView = () => inspectFortuneFromBook(fortune);
          cardEl.addEventListener("click", triggerView);
          cardEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              triggerView();
            }
          });
        } else {
          cardEl.setAttribute("aria-label", `未解鎖的籤詩 #${fortune.id}`);
          cardEl.innerHTML = `
            <div class="book-card__top">
              <span class="book-card__id">#${String(fortune.id).padStart(2, "0")}</span>
              <span class="book-card__grade">未揭曉</span>
            </div>
            <span class="locked-icon" aria-hidden="true">🔒</span>
            <div class="book-card__meld">待機緣開示</div>
          `;
        }

        el.bookCardGrid.appendChild(cardEl);
      });
    }

    function openBook() {
      renderBookCollection();
      el.bookModal.classList.add("book-modal--show");
      el.bookModal.setAttribute("aria-hidden", "false");
    }

    function closeBook() {
      el.bookModal.classList.remove("book-modal--show");
      el.bookModal.setAttribute("aria-hidden", "true");
    }

    function isValidFortune(item) {
      return !!item && typeof item === "object" &&
        ["keyword", "pun", "advice", "grade", "meld_name"].every(k => typeof item[k] === "string" && item[k].trim() !== "") &&
        typeof item.id === "number" &&
        Array.isArray(item.cards) && item.cards.length === 2;
    }

    async function loadData() {
      try {
        const res = await fetch(FORTUNES_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (!data || !Array.isArray(data.fortunes)) {
          throw new Error("JSON 格式不符");
        }

        const clean = data.fortunes.filter(isValidFortune);
        if (clean.length === 0) throw new Error("無完整籤詩");

        fortunePool = clean;
        updateCollectionBadge();
        initMotion();
      } catch (err) {
        el.hint.classList.add("hint--error");
        el.hint.textContent = "籤詩載入失敗，請確認網路或連線。";
        fallbackToButton();
      }
    }

    // 事件監聽註冊
    el.btnAgain.addEventListener("click", resetToDraw);
    el.btnDraw.addEventListener("click", handleMainButtonClick);
    el.btnShareImage.addEventListener("click", shareResultImage);
    el.btnOpenBook.addEventListener("click", openBook);
    el.btnOpenBookResult.addEventListener("click", openBook);
    el.btnCloseBook.addEventListener("click", closeBook);

    // 點擊圖鑑遮罩背景關閉
    el.bookModal.addEventListener("click", (e) => {
      if (e.target === el.bookModal) closeBook();
    });

    loadData();

    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("touchmove", e => {
      const t = e.target;
      const inScroll = t instanceof Element && (t.closest(".result-scroll") || t.closest(".book-content"));
      if (!inScroll) e.preventDefault();
    }, { passive: false });
  </script>
</body>

</html>
