<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1C3B2A">
  <meta name="description" content="掃碼即玩的四色牌諧音籤：搖一搖摸二十張，照四色牌規則湊一副，配一張諧音梗吊牌。">
  <title>四色諧音牌・摸一副好運</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================================
   01. 設計變數
   ========================================================= */
    :root {
      --felt: #234536;
      --felt-deep: #142A1D;
      --cream: #F2E9D5;
      --cream-soft: #C9C0AA;

      --ink: #221C19;
      --ink-soft: #5E5149;
      --red: #C0342A;
      --red-deep: #8C1F18;
      --gold: #A8823E;
      --gold-light: #DFC384;

      /* 四色牌鮮豔花色 */
      --tile-red-a: #FF3B30;
      --tile-red-b: #D70015;
      --tile-red-ink: #1E1206;
      --tile-green-a: #34C759;
      --tile-green-b: #248A3D;
      --tile-green-ink: #10240F;
      --tile-yellow-a: #FFD60A;
      --tile-yellow-b: #FF9F0A;
      --tile-yellow-ink: #241D06;
      --tile-white-a: #FFFFFF;
      --tile-white-b: #E5E5EA;
      --tile-white-ink: #201A12;

      --a-red: #C63A12;
      --a-yellow: #C79A10;
      --a-green: #177A2C;
      --a-white: #8C8371;
      --a-mixed: #A8823E;

      --shake-time: 1.2s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--cream);
      background: radial-gradient(125% 90% at 50% 6%, #2E5941 0%, var(--felt) 46%, var(--felt-deep) 100%);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(45deg, rgba(0, 0, 0, .10) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 6px);
    }

    /* =========================================================
   02. 版面骨架
   ========================================================= */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
    }

    /* =========================================================
   03. 標題
   ========================================================= */
    .masthead {
      flex: 0 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .masthead__title {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: clamp(26px, 7.4vw, 33px);
      letter-spacing: .26em;
      text-indent: .26em;
      color: var(--cream);
    }

    .masthead__sub {
      margin: 8px 0 0;
      font-size: 13px;
      letter-spacing: .06em;
      color: var(--cream-soft);
    }

    .seal {
      width: 42px;
      height: 42px;
      margin: 0 0 10px;
      display: grid;
      place-items: center;
      transform: rotate(-7deg);
      background: linear-gradient(160deg, var(--red), var(--red-deep));
      border-radius: 5px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
      color: #FBEFD8;
      font-family: "Noto Serif TC", serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1;
    }

    /* =========================================================
   04. 四色牌牌面
   ========================================================= */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 9% 0;
      border-radius: 999px;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      line-height: .9;
      color: var(--tile-ink);
      box-shadow: 0 4px 8px -3px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .35);
    }

    .tile__glyph {
      display: block;
    }

    .tile__glyph--bottom {
      transform: rotate(180deg);
    }

    .tile--red {
      --tile-ink: var(--tile-red-ink);
      background: linear-gradient(168deg, var(--tile-red-a), var(--tile-red-b));
    }

    .tile--green {
      --tile-ink: var(--tile-green-ink);
      background: linear-gradient(168deg, var(--tile-green-a), var(--tile-green-b));
    }

    .tile--yellow {
      --tile-ink: var(--tile-yellow-ink);
      background: linear-gradient(168deg, var(--tile-yellow-a), var(--tile-yellow-b));
    }

    .tile--white {
      --tile-ink: var(--tile-white-ink);
      background: linear-gradient(168deg, var(--tile-white-a), var(--tile-white-b));
      border: 1px solid rgba(120, 110, 88, .45);
    }

    /* =========================================================
   05. 牌桌與飛牌動畫
   ========================================================= */
    .table-stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .fan {
      position: relative;
      width: 230px;
      height: 210px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .fan .fan__card {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 56px;
      height: 125px;
      margin-left: -28px;
      transform-origin: 50% 138%;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    }

    .fan .fan__card:nth-child(1) {
      transform: rotate(-22deg);
    }

    .fan .fan__card:nth-child(2) {
      transform: rotate(-11deg);
    }

    .fan .fan__card:nth-child(3) {
      transform: rotate(0deg);
    }

    .fan .fan__card:nth-child(4) {
      transform: rotate(11deg);
    }

    .fan .fan__card:nth-child(5) {
      transform: rotate(22deg);
    }

    .fan .tile {
      font-size: 26px;
    }

    @keyframes deck-shake {
      0% {
        transform: rotate(0deg) translateX(0);
      }

      9% {
        transform: rotate(-9deg) translateX(-9px);
      }

      21% {
        transform: rotate(8deg) translateX(9px);
      }

      33% {
        transform: rotate(-7deg) translateX(-8px);
      }

      45% {
        transform: rotate(6deg) translateX(7px);
      }

      57% {
        transform: rotate(-5deg) translateX(-5px);
      }

      69% {
        transform: rotate(4deg) translateX(4px);
      }

      81% {
        transform: rotate(-2.5deg)translateX(-2px);
      }

      92% {
        transform: rotate(1.2deg) translateX(1px);
      }

      100% {
        transform: rotate(0deg) translateX(0);
      }
    }

    .is-shaking {
      animation: deck-shake var(--shake-time) cubic-bezier(.36, .07, .19, .97) both;
    }

    .fly-layer {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 0;
      height: 0;
      z-index: 5;
      pointer-events: none;
    }

    .fly-tile {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 80px;
      margin: -40px 0 0 -22px;
      font-size: 20px;
      opacity: 0;
      will-change: transform, opacity;
      animation: fly-scatter .95s ease-out forwards;
    }

    @keyframes fly-scatter {
      0% {
        opacity: 0;
        transform: translate(0, 26px) rotate(0deg) rotateY(0deg) scale(.5);
      }

      14% {
        opacity: 1;
      }

      60% {
        opacity: 1;
        transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) rotateY(180deg) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(var(--fx), calc(var(--fy) - 24px)) rotate(calc(var(--fr) + 36deg)) rotateY(360deg) scale(.9);
      }
    }

    /* =========================================================
   06. 按鈕與提示
   ========================================================= */
    .actions {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .16em;
      text-indent: .16em;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 14px 38px;
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
      transform: none;
    }

    .btn--draw {
      color: #FCF3DF;
      border-color: var(--gold-light);
      background: linear-gradient(180deg, #CE4032 0%, var(--red) 45%, var(--red-deep) 100%);
      box-shadow: 0 14px 26px -12px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .28);
      min-width: 220px;
    }

    .btn--again {
      color: #FCF3DF;
      border-color: var(--gold-light);
      background: linear-gradient(180deg, #CE4032 0%, var(--red) 45%, var(--red-deep) 100%);
      box-shadow: 0 10px 20px -10px rgba(0, 0, 0, .8);
      font-size: 14px;
      padding: 11px 22px;
      letter-spacing: .12em;
      text-indent: .12em;
    }

    .btn--copy {
      color: var(--cream);
      background: transparent;
      border-color: rgba(223, 195, 132, .6);
      font-size: 14px;
      font-weight: 500;
      padding: 11px 22px;
      letter-spacing: .12em;
      text-indent: .12em;
    }

    .linkish {
      background: none;
      border: 0;
      padding: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--cream-soft);
      border-bottom: 1px dashed rgba(201, 192, 170, .5);
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--cream-soft);
      min-height: 1.2em;
      text-align: center;
      max-width: 300px;
      white-space: pre-line;
    }

    .hint--error {
      color: #FFB4A6;
    }

    /* =========================================================
   07. 開牌後：手牌區（置中、單屏、強烈中獎特效）
   ========================================================= */
    #viewResult {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(env(safe-area-inset-top) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 14px);
    }

    /* 調整此處：居中排列、上下均勻間距，讓手牌位置更靠中央 */
    .result-scroll {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2.5vh, 22px);
      padding: 0;
    }

    .hand {
      flex: 0 0 auto;
      width: 100%;
      text-align: center;
    }

    .hand__label {
      margin: 0 0 8px;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: .08em;
      color: var(--cream-soft);
    }

    .hand__label em {
      font-style: normal;
      color: #FFE58F;
      font-weight: 700;
    }

    /* 20 支手牌緊湊排版：10 欄 × 2 列 */
    .hand__grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
    }

    .hand__grid .tile {
      width: 100%;
      aspect-ratio: 22/42;
      font-size: 12px;
      padding: 5% 0;
      transition: transform .25s ease, opacity .25s ease, filter .25s ease;
    }

    /* ★★★ 中獎牌特效：強烈浮起放大 + 雙層金色呼吸燈 ★★★ */
    @keyframes win-glow {

      0%,
      100% {
        box-shadow:
          0 0 0 2px #FFE58F,
          0 0 8px 2px rgba(255, 215, 0, 0.7),
          0 8px 16px -4px rgba(0, 0, 0, 0.9);
      }

      50% {
        box-shadow:
          0 0 0 2.5px #FFFFFF,
          0 0 18px 6px rgba(255, 215, 0, 0.98),
          0 12px 22px -4px rgba(0, 0, 0, 0.95);
      }
    }

    .hand__grid .tile--hit {
      z-index: 10 !important;
      position: relative !important;
      transform: translateY(-5px) scale(1.12) !important;
      border: 1.5px solid #FFF3C4 !important;
      animation: win-glow 1.25s ease-in-out infinite !important;
      filter: brightness(1.12) contrast(1.1);
    }

    /* ★ 未中獎散牌：壓暗半透明 + 稍微縮小襯托中獎者 */
    .hand__grid .tile--dim {
      opacity: .22 !important;
      filter: saturate(.3) brightness(.8) !important;
      transform: scale(.93) !important;
    }

    /* =========================================================
   08. 籤牌區
   ========================================================= */
    .charm {
      position: relative;
      flex: 0 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding-top: 26px;
      transform-origin: 50% 6px;
    }

    .charm__cord {
      position: absolute;
      top: 0;
      left: 50%;
      margin-left: -44px;
      width: 88px;
      height: 58px;
      z-index: 3;
      pointer-events: none;
    }

    .tag {
      --accent: var(--a-mixed);
      position: relative;
      padding: 24px 18px 14px;
      border-radius: 18px;
      border: 1px solid var(--accent);
      color: var(--ink);
      background:
        repeating-linear-gradient(96deg, rgba(158, 118, 58, .05) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #FCF5E6 0%, #F3E7CF 56%, #EADCBE 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        inset 0 -3px 8px rgba(120, 86, 40, .12),
        0 20px 30px -15px rgba(0, 0, 0, .8);
    }

    .tag::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--accent);
      opacity: .4;
      border-radius: 13px;
      pointer-events: none;
    }

    .tag__band {
      position: absolute;
      left: 26%;
      right: 26%;
      height: 4px;
      background: var(--accent);
      opacity: .85;
      border-radius: 3px;
    }

    .tag__band--top {
      top: 12px;
    }

    .tag__band--bottom {
      bottom: 10px;
    }

    .tag__eyelet {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 4px solid #B5912F;
      background: radial-gradient(circle at 50% 32%, #4A3B2C, #7A6851);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 255, 255, .8);
      z-index: 2;
    }

    .tag__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tag__meld {
      font-family: "Noto Serif TC", serif;
      font-size: 13.5px;
      letter-spacing: .1em;
      color: var(--accent);
      font-weight: 700;
    }

    .tag__grade {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .1em;
      text-indent: .1em;
      color: #FBEFD8;
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--gold-light);
      background: linear-gradient(180deg, var(--red), var(--red-deep));
      white-space: nowrap;
    }

    .tag__keyword {
      margin: 10px 0 0;
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      font-size: clamp(23px, 6.8vw, 30px);
      line-height: 1.15;
      letter-spacing: .12em;
      text-indent: .12em;
      color: var(--ink);
    }

    .tag__rule {
      width: 46px;
      height: 3px;
      margin: 7px auto 8px;
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      opacity: .75;
    }

    .tag__pun {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-soft);
      text-align: justify;
      text-justify: inter-ideograph;
    }

    .tag__note {
      display: none;
    }

    .tag__advice {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(168, 130, 62, .3);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .advice__cell {
      padding: 0 8px;
      text-align: center;
    }

    .advice__cell+.advice__cell {
      border-left: 1px solid rgba(168, 130, 62, .3);
    }

    .advice__label {
      display: block;
      font-family: "Noto Serif TC", serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .advice__cell--do .advice__label {
      color: var(--red);
    }

    .advice__cell--avoid .advice__label {
      color: var(--ink);
    }

    .advice__value {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    @keyframes charm-drop {
      0% {
        opacity: 0;
        transform: translateY(-40px) rotate(-8deg);
      }

      40% {
        opacity: 1;
        transform: translateY(0) rotate(5deg);
      }

      70% {
        transform: rotate(-2deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .charm--in {
      animation: charm-drop 1.1s cubic-bezier(.26, .8, .32, 1) both;
    }

    .result-head {
      flex: 0 0 auto;
      margin: 0;
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-size: 13px;
      letter-spacing: .25em;
      text-indent: .25em;
      color: var(--cream-soft);
    }

    .result-actions {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-top: 6px;
    }

    /* =========================================================
   09. 提示訊息與自適應
   ========================================================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 80px);
      transform: translate(-50%, 14px);
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(10, 20, 14, .95);
      color: #F6EEDC;
      font-size: 13px;
      letter-spacing: .08em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 20;
    }

    .toast--show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion:reduce) {

      .is-shaking,
      .fly-tile,
      .charm--in,
      .hand__grid .tile--hit {
        animation: none !important;
      }

      .fly-tile {
        opacity: 0 !important;
      }

      .charm--in {
        opacity: 1;
      }

      .hand__grid .tile--hit {
        box-shadow: 0 0 12px 3px rgba(255, 215, 0, 0.9) !important;
        transform: translateY(-4px) scale(1.1) !important;
      }
    }

    @media (max-height:680px) {
      .fan {
        transform: scale(.84);
      }

      .charm {
        padding-top: 20px;
      }

      .tag {
        padding: 16px 14px 10px;
      }

      .tag__keyword {
        font-size: 22px;
        margin-top: 6px;
      }

      .tag__pun {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
    }

    @media (max-height:600px) {
      .result-head {
        display: none;
      }

      .charm__cord {
        display: none;
      }

      .charm {
        padding-top: 4px;
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <!-- ===================== 畫面一：牌桌 ===================== -->
    <section class="view" id="viewDraw">
      <header class="masthead">
        <span class="seal" aria-hidden="true">諧</span>
        <h1 class="masthead__title">四色諧音牌</h1>
        <p class="masthead__sub">搖一搖摸二十張，湊成一副就是你的籤</p>
      </header>

      <div class="table-stage" id="tableStage">
        <div class="fan" id="fan" aria-hidden="true">
          <div class="fan__card tile tile--yellow"><span class="tile__glyph tile__glyph--top">帥</span><span
              class="tile__glyph tile__glyph--bottom">帥</span></div>
          <div class="fan__card tile tile--red"><span class="tile__glyph tile__glyph--top">相</span><span
              class="tile__glyph tile__glyph--bottom">相</span></div>
          <div class="fan__card tile tile--green"><span class="tile__glyph tile__glyph--top">將</span><span
              class="tile__glyph tile__glyph--bottom">將</span></div>
          <div class="fan__card tile tile--white"><span class="tile__glyph tile__glyph--top">卒</span><span
              class="tile__glyph tile__glyph--bottom">卒</span></div>
          <div class="fan__card tile tile--yellow"><span class="tile__glyph tile__glyph--top">俥</span><span
              class="tile__glyph tile__glyph--bottom">俥</span></div>
        </div>
        <div class="fly-layer" id="flyLayer" aria-hidden="true"></div>
      </div>

      <div class="actions">
        <button class="btn btn--draw" id="btnDraw" type="button">搖一搖摸牌</button>
        <button class="linkish" id="btnMotion" type="button" hidden>改用搖手機摸牌</button>
        <p class="hint" id="hint" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- ===================== 畫面二：開牌結果 ===================== -->
    <section class="view" id="viewResult" hidden>
      <p class="result-head">四色諧音牌</p>

      <div class="result-scroll">

        <!-- 手牌區：二十支牌 -->
        <section class="hand">
          <h2 class="hand__label" id="handLabel"></h2>
          <div class="hand__grid" id="handGrid"></div>
        </section>

        <!-- 籤牌吊飾區 -->
        <div class="charm" id="charm">
          <svg class="charm__cord" viewBox="0 0 120 86" aria-hidden="true">
            <defs>
              <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8E211A" />
                <stop offset=".4" stop-color="#D4564A" />
                <stop offset="1" stop-color="#8E211A" />
              </linearGradient>
            </defs>
            <path d="M60,79 C31,60 29,21 60,7 C91,21 89,60 60,79 Z" fill="none" stroke="url(#cord)" stroke-width="5"
              stroke-linecap="round" />
            <rect x="50" y="68" width="20" height="13" rx="6" fill="#A5271F" />
            <rect x="50" y="68" width="20" height="5" rx="2.5" fill="rgba(255,255,255,.22)" />
          </svg>

          <article class="tag" id="tag">
            <span class="tag__band tag__band--top" aria-hidden="true"></span>
            <span class="tag__eyelet" aria-hidden="true"></span>

            <div class="tag__meta">
              <span class="tag__meld" id="tagMeld"></span>
              <span class="tag__grade" id="tagGrade"></span>
            </div>

            <h2 class="tag__keyword" id="tagKeyword"></h2>
            <div class="tag__rule" aria-hidden="true"></div>
            <p class="tag__pun" id="tagPun"></p>

            <div class="tag__advice" id="tagAdvice"></div>
            <span class="tag__band tag__band--bottom" aria-hidden="true"></span>
          </article>
        </div>

      </div>

      <div class="result-actions">
        <button class="btn btn--again" id="btnAgain" type="button">再摸一副</button>
        <button class="btn btn--copy" id="btnCopy" type="button">複製結果分享</button>
      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const FORTUNES_URL = "fortunes.json";

    const PIECES = [
      { id: "general", redGlyph: "帥", blackGlyph: "將" },
      { id: "guard", redGlyph: "仕", blackGlyph: "士" },
      { id: "elephant", redGlyph: "相", blackGlyph: "象" },
      { id: "chariot", redGlyph: "俥", blackGlyph: "車" },
      { id: "horse", redGlyph: "傌", blackGlyph: "馬" },
      { id: "cannon", redGlyph: "炮", blackGlyph: "包" },
      { id: "pawn", redGlyph: "兵", blackGlyph: "卒" }
    ];

    const SUITS = [
      { id: "yellow", label: "黃", army: "red" },
      { id: "red", label: "紅", army: "red" },
      { id: "green", label: "綠", army: "black" },
      { id: "white", label: "白", army: "black" }
    ];

    const COPIES = 4;
    const HAND_SIZE = 20;

    const GENERAL_SET = ["general", "guard", "elephant"];
    const CHARIOT_SET = ["chariot", "horse", "cannon"];

    const REQUIRED_MELDS = ["four_pawn", "kong", "three_pawn", "general_set", "pong", "chariot_set", "pair", "none"];
    const CN_NUM = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

    let meldConfig = {};
    let fortunePool = [];
    let currentHand = [];
    let currentMeld = null;
    let currentFortune = null;

    const el = {
      viewDraw: document.getElementById("viewDraw"),
      viewResult: document.getElementById("viewResult"),
      tableStage: document.getElementById("tableStage"),
      fan: document.getElementById("fan"),
      flyLayer: document.getElementById("flyLayer"),
      btnDraw: document.getElementById("btnDraw"),
      btnMotion: document.getElementById("btnMotion"),
      btnAgain: document.getElementById("btnAgain"),
      btnCopy: document.getElementById("btnCopy"),
      hint: document.getElementById("hint"),
      handLabel: document.getElementById("handLabel"),
      handGrid: document.getElementById("handGrid"),
      charm: document.getElementById("charm"),
      tag: document.getElementById("tag"),
      tagMeld: document.getElementById("tagMeld"),
      tagGrade: document.getElementById("tagGrade"),
      tagKeyword: document.getElementById("tagKeyword"),
      tagPun: document.getElementById("tagPun"),
      tagAdvice: document.getElementById("tagAdvice"),
      toast: document.getElementById("toast")
    };

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let isDrawing = false;
    let motionOn = false;

    function toChinese(n) {
      if (n <= 10) return CN_NUM[n];
      if (n < 20) return "十" + (n % 10 === 0 ? "" : CN_NUM[n % 10]);
      return CN_NUM[Math.floor(n / 10)] + "十" + (n % 10 === 0 ? "" : CN_NUM[n % 10]);
    }
    function showToast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add("toast--show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.toast.classList.remove("toast--show"), 2000);
    }

    function buildDeck() {
      const deck = [];
      for (const suit of SUITS) {
        for (const piece of PIECES) {
          const glyph = suit.army === "red" ? piece.redGlyph : piece.blackGlyph;
          for (let i = 0; i < COPIES; i++) {
            deck.push({
              suit: suit.id,
              label: suit.label,
              piece: piece.id,
              glyph: glyph
            });
          }
        }
      }
      return deck;
    }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function dealHand() {
      return shuffle(buildDeck()).slice(0, HAND_SIZE);
    }

    function findMeld(hand) {
      const sameCard = new Map();
      const bySuit = new Map();
      const pawnBySuit = new Map();

      hand.forEach((card, i) => {
        const key = card.suit + "-" + card.piece;
        if (!sameCard.has(key)) sameCard.set(key, []);
        sameCard.get(key).push(i);

        if (!bySuit.has(card.suit)) bySuit.set(card.suit, new Map());
        const pieceMap = bySuit.get(card.suit);
        if (!pieceMap.has(card.piece)) pieceMap.set(card.piece, i);

        if (card.piece === "pawn" && !pawnBySuit.has(card.suit)) {
          pawnBySuit.set(card.suit, i);
        }
      });

      // 1. 開（槓）8 胡
      for (const idx of sameCard.values()) {
        if (idx.length >= 4) return { id: "kong", cards: idx.slice(0, 4) };
      }
      // 2. 四色卒 5 胡
      if (pawnBySuit.size >= 4) {
        return { id: "four_pawn", cards: [...pawnBySuit.values()].slice(0, 4) };
      }
      // 3. 三色卒 3 胡
      if (pawnBySuit.size >= 3) {
        return { id: "three_pawn", cards: [...pawnBySuit.values()].slice(0, 3) };
      }
      // 4. 碰 3 胡
      for (const idx of sameCard.values()) {
        if (idx.length >= 3) return { id: "pong", cards: idx.slice(0, 3) };
      }
      // 5. 同色將士象 2 胡
      for (const pieceMap of bySuit.values()) {
        if (GENERAL_SET.every(p => pieceMap.has(p))) {
          return { id: "general_set", cards: GENERAL_SET.map(p => pieceMap.get(p)) };
        }
      }
      // 6. 同色車馬包 1 胡
      for (const pieceMap of bySuit.values()) {
        if (CHARIOT_SET.every(p => pieceMap.has(p))) {
          return { id: "chariot_set", cards: CHARIOT_SET.map(p => pieceMap.get(p)) };
        }
      }
      // 7. 對子 0 胡
      for (const idx of sameCard.values()) {
        if (idx.length >= 2) return { id: "pair", cards: idx.slice(0, 2) };
      }
      return { id: "none", cards: [] };
    }

    function spawnFlyingTiles(hand) {
      el.flyLayer.innerHTML = "";
      hand.forEach((card, i) => {
        const fly = makeTile(card);
        fly.classList.add("fly-tile");
        fly.style.setProperty("--fx", (Math.random() * 260 - 130).toFixed(0) + "px");
        fly.style.setProperty("--fy", (Math.random() * -140 - 20).toFixed(0) + "px");
        fly.style.setProperty("--fr", (Math.random() * 360 - 180).toFixed(0) + "deg");
        fly.style.animationDelay = (i * 28) + "ms";
        el.flyLayer.appendChild(fly);
      });
    }
    function clearFlyingTiles() {
      el.flyLayer.innerHTML = "";
    }

    function makeTile(card, extraClass) {
      const tile = document.createElement("div");
      tile.className = "tile tile--" + card.suit + (extraClass ? " " + extraClass : "");
      tile.setAttribute("aria-label", card.label + card.glyph);
      const top = document.createElement("span");
      top.className = "tile__glyph tile__glyph--top";
      top.textContent = card.glyph;
      const bottom = document.createElement("span");
      bottom.className = "tile__glyph tile__glyph--bottom";
      bottom.textContent = card.glyph;
      bottom.setAttribute("aria-hidden", "true");
      tile.append(top, bottom);
      return tile;
    }

    function accentOf(meld, hand) {
      if (!meld.cards.length) return "var(--a-mixed)";
      const suits = new Set(meld.cards.map(i => hand[i].suit));
      if (suits.size > 1) return "var(--a-mixed)";
      return "var(--a-" + [...suits][0] + ")";
    }

    function renderAdvice(text) {
      el.tagAdvice.innerHTML = "";
      const parts = String(text).split("/").map(s => s.trim()).filter(Boolean);
      const kinds = ["do", "avoid"];
      parts.slice(0, 2).forEach((part, i) => {
        const seg = part.split(/[:：]/);
        const label = (seg[0] || "").trim();
        const value = (seg.slice(1).join("：") || "").trim();
        const cell = document.createElement("div");
        cell.className = "advice__cell advice__cell--" + (kinds[i] || "do");
        cell.innerHTML = '<span class="advice__label"></span><span class="advice__value"></span>';
        cell.querySelector(".advice__label").textContent = label;
        cell.querySelector(".advice__value").textContent = value;
        el.tagAdvice.appendChild(cell);
      });
    }

    function renderResult() {
      const cfg = meldConfig[currentMeld.id];
      const hit = new Set(currentMeld.cards);
      const hasMeld = currentMeld.cards.length > 0;

      // 手牌 20 支渲染
      el.handGrid.innerHTML = "";
      currentHand.forEach((card, i) => {
        const isHit = hit.has(i);
        const extra = isHit ? "tile--hit" : (hasMeld ? "tile--dim" : "");
        const tile = makeTile(card, extra);
        el.handGrid.appendChild(tile);
      });

      el.handLabel.innerHTML = hasMeld
        ? "手牌二十支・中獎成副：<em>【" + cfg.name + "】</em>"
        : "手牌二十支・<em>無成副（全散牌）</em>";

      // 籤牌資料綁定
      el.tag.style.setProperty("--accent", accentOf(currentMeld, currentHand));
      el.tagMeld.textContent = cfg.name + (cfg.fu > 0 ? "・" + toChinese(cfg.fu) + "福" : "・無福");
      el.tagGrade.textContent = cfg.grade;

      el.tagKeyword.textContent = currentFortune.keyword;
      el.tagPun.textContent = currentFortune.pun;
      renderAdvice(currentFortune.advice);

      el.viewDraw.hidden = true;
      el.viewResult.hidden = false;

      el.charm.classList.remove("charm--in");
      void el.charm.offsetWidth;
      el.charm.classList.add("charm--in");
      el.btnAgain.focus({ preventScroll: true });
    }

    function drawFortune() {
      if (isDrawing || !el.viewResult.hidden) return;
      if (fortunePool.length === 0) { showToast("籤詩還沒載入完成"); return; }
      isDrawing = true;
      el.btnDraw.disabled = true;

      currentHand = dealHand();
      currentMeld = findMeld(currentHand);
      currentFortune = fortunePool[Math.floor(Math.random() * fortunePool.length)];

      if (reduceMotion) {
        setTimeout(finish, 150);
        return;
      }
      spawnFlyingTiles(currentHand);
      el.fan.classList.add("is-shaking");
      setTimeout(finish, 1450);
    }

    function finish() {
      el.fan.classList.remove("is-shaking");
      clearFlyingTiles();
      renderResult();
      isDrawing = false;
      el.btnDraw.disabled = false;
    }

    function resetToDraw() {
      el.viewResult.hidden = true;
      el.viewDraw.hidden = false;
      el.charm.classList.remove("charm--in");
      clearFlyingTiles();
      el.btnDraw.disabled = false;
      isDrawing = false;
      el.btnDraw.focus({ preventScroll: true });
    }

    function shareText() {
      if (!currentMeld || !currentFortune) return "";
      const cfg = meldConfig[currentMeld.id];
      const cards = currentMeld.cards.map(i => currentHand[i].label + currentHand[i].glyph).join(" ");
      return [
        "【四色諧音牌】",
        "牌型：" + cfg.name + "（" + cfg.grade + (cfg.fu > 0 ? "・" + toChinese(cfg.fu) + "福" : "") + "）",
        cards ? "成副：" + cards : "成副：無，二十張全是閒牌",
        "",
        currentFortune.keyword,
        currentFortune.pun,
        currentFortune.advice
      ].join("\n");
    }

    async function copyResult() {
      const text = shareText();
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast("已複製，快去貼給朋友");
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand && document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(ok ? "已複製，快去貼給朋友" : "這個瀏覽器不給複製，先截圖吧");
      }
    }

    const SHAKE_THRESHOLD = 22;
    let lastShakeAt = 0;

    function onDeviceMotion(e) {
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      const force = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
      const now = Date.now();
      if (force > SHAKE_THRESHOLD && now - lastShakeAt > 2000) {
        lastShakeAt = now;
        if (!el.viewDraw.hidden) drawFortune();
      }
    }

    function attachMotion() {
      window.addEventListener("devicemotion", onDeviceMotion);
      motionOn = true;
      el.btnMotion.hidden = true;
      el.hint.textContent = "感應已開啟，用力搖手機就會摸牌";
    }

    function enableMotion() {
      if (motionOn) return;
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission()
          .then(state => {
            if (state === "granted") attachMotion();
            else el.hint.textContent = "沒拿到感測權限，按按鈕摸一樣準";
          })
          .catch(() => { el.hint.textContent = "這台裝置不支援搖晃感應，按按鈕就好"; });
      } else if ("DeviceMotionEvent" in window) {
        attachMotion();
      } else {
        el.btnMotion.hidden = true;
        el.hint.textContent = "這台裝置沒有搖晃感應，按按鈕就好";
      }
    }

    function isValidFortune(item) {
      return !!item && typeof item === "object" &&
        ["keyword", "pun", "advice"].every(k => typeof item[k] === "string" && item[k].trim() !== "");
    }

    function isValidMeld(item) {
      return !!item && typeof item === "object" &&
        ["id", "name", "grade", "note"].every(k => typeof item[k] === "string" && item[k].trim() !== "") &&
        typeof item.fu === "number";
    }

    function setLoading() {
      el.btnDraw.disabled = true;
      el.btnMotion.hidden = true;
      el.hint.classList.remove("hint--error");
      el.hint.textContent = "";
    }

    function setReady(skipped) {
      el.btnDraw.disabled = false;
      el.hint.classList.remove("hint--error");
      el.hint.textContent = "";
      if (skipped > 0) console.warn("[四色諧音牌] 有 " + skipped + " 筆籤詩欄位不完整，已略過。");
      if ("DeviceMotionEvent" in window && window.matchMedia("(pointer:coarse)").matches) {
        el.btnMotion.hidden = false;
      }
    }

    function setError(err) {
      el.btnDraw.disabled = true;
      el.btnMotion.hidden = true;
      el.hint.classList.add("hint--error");
      el.hint.textContent = location.protocol === "file:"
        ? "讀不到 " + FORTUNES_URL + "。\n直接雙擊開啟網頁時，瀏覽器會擋住讀取本機檔案。\n請改用本機伺服器開啟，例如：\npython3 -m http.server 8000"
        : "讀不到或無法解析 " + FORTUNES_URL + "。\n請確認檔案和 index.html 放在同一層，且 JSON 格式正確。\n（" + err.message + "）";
    }

    async function loadData() {
      setLoading();
      try {
        const res = await fetch(FORTUNES_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (!data || !Array.isArray(data.melds) || !Array.isArray(data.fortunes)) {
          throw new Error("JSON 必須包含 melds 與 fortunes 兩個陣列");
        }

        const cfg = {};
        data.melds.filter(isValidMeld).forEach(m => { cfg[m.id] = m; });
        const missing = REQUIRED_MELDS.filter(id => !cfg[id]);
        if (missing.length) throw new Error("melds 缺少牌型：" + missing.join("、"));

        const clean = data.fortunes.filter(isValidFortune);
        if (clean.length === 0) throw new Error("沒有任何一筆欄位完整的諧音梗");

        meldConfig = cfg;
        fortunePool = clean;
        setReady(data.fortunes.length - clean.length);
      } catch (err) {
        meldConfig = {};
        fortunePool = [];
        setError(err);
      }
    }

    el.btnDraw.addEventListener("click", drawFortune);
    el.btnAgain.addEventListener("click", () => { resetToDraw(); drawFortune(); });
    el.btnCopy.addEventListener("click", copyResult);
    el.btnMotion.addEventListener("click", enableMotion);

    loadData();

    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("touchmove", e => {
      const t = e.target;
      const inScroll = t instanceof Element && t.closest(".result-scroll");
      if (!inScroll) e.preventDefault();
    }, { passive: false });
  </script>
</body>
